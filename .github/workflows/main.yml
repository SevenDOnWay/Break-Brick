name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: bash test/check-meta-files.sh
      - run: bash test/check-lfs-files.sh "${{ github.event.before }}" "${{ github.sha }}"

  unity-editmode:
    name: Unity EditMode tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: unity-ci
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ runner.os }}-

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - run: |
          dotnet tool restore
          dotnet nugetforunity restore .

      - name: Disable duplicate JetBrains annotations importer
        run: >
          cp test/nuget-for-unity/JetBrains.Annotations.dll.meta
          Assets/Packages/JetBrains.Annotations.2025.2.2/lib/netstandard2.0/JetBrains.Annotations.dll.meta

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Unity test results
          path: artifacts
          if-no-files-found: warn
